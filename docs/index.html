<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toronto Hacker Fab - Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for Toronto Hacker Fab">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
    :root {
      --theme-color: #fca311;
    }
    .math-block {
      overflow-x: auto;
      overflow-y: hidden;
      margin: 1em 0;
    }
    iframe.hf-widget {
      width: 100%;
      height: 1100px;
      border: 0;
      display: block;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Toronto Hacker Fab Docs',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      plugins: [
        // LaTeX math: $inline$ and $$display$$. Math is swapped for plain
        // placeholders before the markdown is parsed, so underscores and
        // backslashes in the LaTeX are never treated as markdown, then
        // rendered with KaTeX and put back. Fenced code blocks are left alone.
        function (hook) {
          var store = []
          hook.beforeEach(function (md) {
            store = []
            return md.split(/(```[\s\S]*?```)/g).map(function (part, i) {
              if (i % 2) return part
              part = part.replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) {
                store.push({ tex: tex, display: true })
                return '\n\nMATHBLOCK' + (store.length - 1) + 'END\n\n'
              })
              return part.replace(/\$([^$\n]+?)\$/g, function (_, tex) {
                store.push({ tex: tex, display: false })
                return 'MATHINLINE' + (store.length - 1) + 'END'
              })
            }).join('')
          })
          hook.afterEach(function (html) {
            html = html.replace(/<p>\s*MATHBLOCK(\d+)END\s*<\/p>/g, function (_, n) {
              return '<div class="math-block">' + katex.renderToString(store[+n].tex, { displayMode: true, throwOnError: false }) + '</div>'
            })
            return html.replace(/MATH(?:BLOCK|INLINE)(\d+)END/g, function (_, n) {
              return katex.renderToString(store[+n].tex, { displayMode: store[+n].display, throwOnError: false })
            })
          })
        }
      ]
    }
  </script>
  <script>
    // Interactive widgets in docs/widgets/ are embedded with iframes and
    // report their content height, so each iframe fits without a scrollbar.
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-widget-height') return
      document.querySelectorAll('iframe.hf-widget').forEach(function (f) {
        if (f.contentWindow === e.source) f.style.height = e.data.height + 'px'
      })
    })
  </script>
  <script src="//cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
