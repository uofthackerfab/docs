<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toronto Hacker Fab - Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for Toronto Hacker Fab">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #fca311;
    }
    iframe.hf-widget {
      width: 100%;
      height: 1100px;
      border: 0;
      display: block;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Toronto Hacker Fab Docs',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true
    }
  </script>
  <script>
    // Interactive widgets in docs/widgets/ are embedded with iframes and
    // report their content height, so each iframe fits without a scrollbar.
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-widget-height') return
      document.querySelectorAll('iframe.hf-widget').forEach(function (f) {
        if (f.contentWindow === e.source) f.style.height = e.data.height + 'px'
      })
    })
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
